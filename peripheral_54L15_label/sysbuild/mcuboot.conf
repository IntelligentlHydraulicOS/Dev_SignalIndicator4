# 进入固件加载器模式方式（选其一）
# CONFIG_BOOT_FIRMWARE_LOADER_ENTRANCE_GPIO=y      # 按钮触发
CONFIG_BOOT_FIRMWARE_LOADER_BOOT_MODE=y       # 软件触发

CONFIG_PM_PARTITION_SIZE_MCUBOOT=0xF000
# MCU boot + DFU
# 精简体积
CONFIG_BOOT_BANNER=n
CONFIG_NCS_SAMPLES_DEFAULTS=n
CONFIG_MINIMAL_LIBC=y
CONFIG_CBPRINTF_NANO=y
CONFIG_ASSERT=n
CONFIG_SHELL=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_REBOOT=y
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_FPROTECT=n

# 启用 MCUboot 日志
CONFIG_LOG=n
CONFIG_MCUBOOT_LOG_LEVEL_INF=n

# 启用 UART console
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n