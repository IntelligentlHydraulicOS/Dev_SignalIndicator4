# Enable the UART driver
# CONFIG_UART_ASYNC_API=y
# CONFIG_NRFX_UARTE=y
CONFIG_SERIAL=y

CONFIG_GPIO=y

# Make sure printk is printing to the UART console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Enable DK LED and Buttons library
# CONFIG_DK_LIBRARY=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Config logger
# CONFIG_LOG=y
# CONFIG_USE_SEGGER_RTT=y
# CONFIG_LOG_BACKEND_RTT=y
# CONFIG_LOG_BACKEND_UART=n
# CONFIG_LOG_PRINTK=n

CONFIG_ASSERT=y

CONFIG_PWM=y
CONFIG_NRFX_PWM=y
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_REBOOT=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_WATCHDOG=y

CONFIG_RETENTION=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_ZEPHYR_RAM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

CONFIG_I2C=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_SENSOR=y
CONFIG_I2C_SHELL=y
CONFIG_REGULATOR=y 
# CONFIG_NPM13XX_REGULATOR=y
CONFIG_MFD=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR_NPM13XX=y

# NFC Type 4 writable tag and chip-unique device ID.
CONFIG_NFC_T4T_NRFXLIB=y
CONFIG_HWINFO=y

# 确保 printk 输出到控制台
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_APP_NFC_CONFIG_PIN="12345678"